<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" width="1100" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Xom Arcade Analytics Platform Architecture</title>
  <desc id="desc">Simple and clean architecture diagram showing data flow from SQL Server through Fivetran, Supabase, dbt Core, to dbt Charts and dbt Docs.</desc>

  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f97316" />
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#a855f7" />
    </marker>

    <!-- Unified font and clean styles -->
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .main-title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .main-subtitle { font-size: 14px; font-weight: 400; fill: #64748b; }
      .card-name { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .card-role { font-size: 13px; font-weight: 500; fill: #64748b; }
      .layer-name { font-size: 15px; font-weight: 700; }
      .layer-role { font-size: 12px; font-weight: 500; }
      .flow-label { font-size: 12px; font-weight: 600; fill: #64748b; }
    </style>
  </defs>

  <!-- Clean background -->
  <rect width="1100" height="630" fill="#ffffff" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 44)">
    <text x="0" y="0" class="main-title">Xom Arcade — Data Platform Architecture</text>
    <text x="0" y="24" class="main-subtitle">Luồng xử lý dữ liệu và vai trò của các tầng trong hệ thống</text>
  </g>

  <!-- ==================== ROW 1: INGESTION & WAREHOUSE ==================== -->

  <!-- Card 1: SQL Server -->
  <g transform="translate(60, 95)">
    <rect width="260" height="100" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2" />
    <!-- SQL Server Logo -->
    <g transform="translate(22, 26)">
      <rect width="48" height="48" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <g transform="translate(14, 11)">
        <ellipse cx="10" cy="5" rx="10" ry="3.5" fill="#ef4444" />
        <path d="M 0 5 v 6 c 0 2 4.5 3.5 10 3.5 s 10 -1.5 10 -3.5 v -6" fill="none" stroke="#b91c1c" stroke-width="1.5" />
        <path d="M 0 11 v 6 c 0 2 4.5 3.5 10 3.5 s 10 -1.5 10 -3.5 v -6" fill="none" stroke="#b91c1c" stroke-width="1.5" />
        <path d="M 0 17 v 6 c 0 2 4.5 3.5 10 3.5 s 10 -1.5 10 -3.5 v -6" fill="none" stroke="#b91c1c" stroke-width="1.5" />
      </g>
    </g>
    <text x="84" y="46" class="card-name">SQL Server</text>
    <text x="84" y="68" class="card-role">Nguồn dữ liệu OLTP</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <path d="M 320 145 L 412 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="366" y="135" text-anchor="middle" class="flow-label">Replication</text>
  </g>

  <!-- Card 2: Fivetran -->
  <g transform="translate(420, 95)">
    <rect width="260" height="100" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
    <!-- Fivetran Logo -->
    <g transform="translate(22, 26)">
      <rect width="48" height="48" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
      <g transform="translate(13, 12)">
        <rect x="2" y="2" width="6" height="20" rx="2" fill="#0073ff" />
        <path d="M 11 2 h 9 a 2 2 0 0 1 2 2 v 5 a 2 2 0 0 1 -2 2 h -4 v 9 a 2 2 0 0 1 -2 2 h -1 a 2 2 0 0 1 -2 -2 Z" fill="#0073ff" />
      </g>
    </g>
    <text x="84" y="46" class="card-name">Fivetran</text>
    <text x="84" y="68" class="card-role">Tự động hóa ingest (EL)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <path d="M 680 145 L 772 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="726" y="135" text-anchor="middle" class="flow-label">Load</text>
  </g>

  <!-- Card 3: Supabase Postgres -->
  <g transform="translate(780, 95)">
    <rect width="260" height="100" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="2" />
    <!-- Supabase Logo -->
    <g transform="translate(22, 26)">
      <rect width="48" height="48" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
      <g transform="translate(12, 10)">
        <path d="M 14.5 1.5 C 13.8 0.6 12.3 1.1 12.2 2.3 L 10.5 15.5 C 10.4 16.4 11.3 17.1 12.2 16.8 L 22.5 13.5 C 23.5 13.1 23.8 11.8 22.8 11.2 L 14.5 1.5 Z" fill="#3ecf8e" />
        <path d="M 9.5 24.5 C 10.2 25.4 11.7 24.9 11.8 23.7 L 13.5 10.5 C 13.6 9.6 12.7 8.9 11.8 9.2 L 1.5 12.5 C 0.5 12.9 0.2 14.2 1.2 14.8 L 9.5 24.5 Z" fill="#249361" />
      </g>
    </g>
    <text x="84" y="46" class="card-name">Supabase</text>
    <text x="84" y="68" class="card-role">Kho dữ liệu (PostgreSQL)</text>
  </g>

  <!-- Flow Connector: Row 1 down to Row 2 -->
  <g>
    <path d="M 910 195 V 222 H 550 V 242" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-orange)" />
    <text x="730" y="214" text-anchor="middle" class="flow-label" fill="#ea580c">dbt transformation</text>
  </g>

  <!-- ==================== ROW 2: DBT CORE (TRANSFORMATION) ==================== -->
  <g transform="translate(60, 245)">
    <!-- Outer dbt Container -->
    <rect width="980" height="155" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2" />

    <!-- Container Header -->
    <g transform="translate(24, 20)">
      <!-- dbt logo -->
      <rect width="28" height="28" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.2" />
      <g transform="translate(6, 4)">
        <polygon points="8 1, 15 5, 15 13, 8 17, 1 13, 1 5" fill="#ff7a59" />
        <polygon points="8 1, 15 5, 8 9, 1 5" fill="#ff922b" />
        <polygon points="8 9, 15 5, 15 13, 8 17" fill="#f76707" />
      </g>
      <text x="38" y="19" class="card-name" fill="#c2410c">dbt Core — Tầng biến đổi dữ liệu (Medallion Architecture)</text>
    </g>

    <!-- Stage 1: Bronze -->
    <g transform="translate(24, 60)">
      <rect width="205" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8" />
      <text x="16" y="32" class="layer-name" fill="#92400e">1. Bronze</text>
      <text x="16" y="52" class="layer-role" fill="#b45309">Hợp đồng dữ liệu thô</text>
    </g>

    <!-- Arrow Bronze -> Silver -->
    <path d="M 230 96 L 260 96" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Stage 2: Silver -->
    <g transform="translate(268, 60)">
      <rect width="205" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" />
      <text x="16" y="32" class="layer-name" fill="#334155">2. Silver</text>
      <text x="16" y="52" class="layer-role" fill="#64748b">Làm sạch &amp; chuẩn hóa</text>
    </g>

    <!-- Arrow Silver -> Gold -->
    <path d="M 474 96 L 504 96" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Stage 3: Gold -->
    <g transform="translate(512, 60)">
      <rect width="205" height="72" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.8" />
      <text x="16" y="32" class="layer-name" fill="#854d0e">3. Gold</text>
      <text x="16" y="52" class="layer-role" fill="#a16207">Mô hình Star-schema</text>
    </g>

    <!-- Arrow Gold -> Plat -->
    <path d="M 718 96 L 748 96" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Stage 4: Platinum -->
    <g transform="translate(756, 60)">
      <rect width="200" height="72" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="1.8" />
      <text x="16" y="32" class="layer-name" fill="#6b21a8">4. Platinum</text>
      <text x="16" y="52" class="layer-role" fill="#7e22ce">Marts phân tích nghiệp vụ</text>
    </g>
  </g>

  <!-- Flow Connector: Row 2 down to Row 3 -->
  <g>
    <path d="M 550 400 V 425 H 295 V 445" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-purple)" />
    <path d="M 550 400 V 425 H 805 V 445" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-purple)" />
    <text x="550" y="420" text-anchor="middle" class="flow-label" fill="#7e22ce">Cung cấp dữ liệu</text>
  </g>

  <!-- ==================== ROW 3: CONSUMPTION & DELIVERY ==================== -->

  <!-- Card 5: dbt Charts -->
  <g transform="translate(60, 450)">
    <rect width="470" height="100" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="2" />
    <!-- dbt Charts Logo -->
    <g transform="translate(22, 26)">
      <rect width="48" height="48" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" />
      <g transform="translate(12, 11)">
        <rect x="2" y="14" width="4" height="10" rx="1.5" fill="#a855f7" />
        <rect x="9" y="8" width="4" height="16" rx="1.5" fill="#c084fc" />
        <rect x="16" y="2" width="4" height="22" rx="1.5" fill="#9333ea" />
      </g>
    </g>
    <text x="84" y="46" class="card-name">dbt Charts</text>
    <text x="84" y="68" class="card-role">Báo cáo &amp; Dashboard trực quan hóa (BI)</text>
  </g>

  <!-- Card 6: dbt Docs -->
  <g transform="translate(570, 450)">
    <rect width="470" height="100" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2" />
    <!-- dbt Docs Logo -->
    <g transform="translate(22, 26)">
      <rect width="48" height="48" rx="10" fill="#ffffff" stroke="#ccfbf1" stroke-width="1.5" />
      <g transform="translate(12, 11)">
        <circle cx="5" cy="13" r="3" fill="#14b8a6" />
        <circle cx="15" cy="5" r="3" fill="#0d9488" />
        <circle cx="19" cy="17" r="3" fill="#2dd4bf" />
        <line x1="7" y1="11" x2="13" y2="7" stroke="#14b8a6" stroke-width="1.5" />
        <line x1="7" y1="14" x2="17" y2="16" stroke="#14b8a6" stroke-width="1.5" />
      </g>
    </g>
    <text x="84" y="46" class="card-name">dbt Docs</text>
    <text x="84" y="68" class="card-role">Data Catalog &amp; Biểu đồ quan hệ Lineage</text>
  </g>

  <!-- Footer Note -->
  <g transform="translate(60, 595)">
    <text x="490" y="0" text-anchor="middle" font-size="13" fill="#94a3b8">
      Kiến trúc Modern Data Stack • Tự động hóa ELT &amp; Kiểm soát chất lượng dữ liệu
    </text>
  </g>
</svg>
